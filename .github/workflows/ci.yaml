name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
      
      - name: Init Terraform
        run: |
          terraform init
          terraform fmt -check -recursive
      
      - name: Plan and apply
        run: terraform apply -auto-approve

